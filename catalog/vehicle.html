<!-- family: Araç ve binek | Hız kadranı, kompakt hız, yakıt/motor ölçerleri, gösterge lambaları, halka ölçer ve at (binek) paneli. -->

<section data-id="speedo" data-title="Hız kadranı" data-use="Dairesel kadran: hız yayı, son %15 kırmızı bölge, ince devir yayı, vites, lambalar. data-speed (zorunlu), data-max (240), data-rpm (0-1), data-gear ile EUI.mount kurar." data-js="EUI.speedo(el, { speed: 148, max: 240, rpm: 0.62, gear: 4 })">
<div class="eui-speedo" data-speed="148" data-max="240" data-rpm=".62" data-gear="4">
  <svg class="eui-speedo__dial" viewBox="0 0 240 240"></svg>
  <div class="eui-speedo__center"><span class="eui-speedo__value">0</span><span class="eui-speedo__unit">KM/S</span><span class="eui-speedo__gear">1</span></div>
  <div class="eui-speedo__lamps"><span class="eui-lamp on"><i data-i="user-shield"></i></span><span class="eui-lamp is-warn"><i data-i="engine"></i></span><span class="eui-lamp"><i data-i="gauge"></i></span></div>
</div>
</section>

<section data-id="speed-mini" data-title="Kompakt hız" data-use="Büyük sayı + vites + devir segmentleri; son üç segment kırmızıya döner. Motosiklet ve tekne için." data-js="el.querySelector('.eui-speed-mini__value').textContent = 87; EUI.pips(el.querySelector('.eui-pips'), 11, 14)">
<div class="eui-speed-mini">
  <span class="eui-speed-mini__value">87</span>
  <div class="eui-speed-mini__side">
    <span class="eui-speedo__gear" style="margin:0;width:26px;height:26px;font-size:15px">3</span>
    <span class="eui-speed-mini__unit">KM/S</span>
    <div class="eui-pips eui-t-success" data-pips="11/14"></div>
  </div>
</div>
</section>

<section data-id="gauges" data-title="Yakıt ve motor ölçerleri" data-use="İkon + ince bar satırları (yakıt, motor, nitro). data-critical altında is-low ve kırmızı yanıp sönme." data-js="EUI.bar(el.querySelector('.eui-bar'), 64, { critical: 15 })">
<div class="eui-gauges" style="width:200px">
  <div class="eui-gauge"><i data-i="gas"></i><div class="eui-bar eui-t-warn" data-v="64" data-critical="15"><i class="eui-bar__fill"></i></div></div>
  <div class="eui-gauge"><i data-i="engine"></i><div class="eui-bar eui-t-success" data-v="88" data-critical="25"><i class="eui-bar__fill"></i></div></div>
  <div class="eui-gauge"><i data-i="flame"></i><div class="eui-bar eui-t-info" data-v="40"><i class="eui-bar__fill"></i></div></div>
</div>
</section>

<section data-id="fuel-ring" data-title="Halka ölçer" data-use="Ortasında ikon olan halka: yakıt, pil, nitro. Dar yer için gauges yerine." data-js="EUI.ring(el, 0.64)">
<div class="eui-flex eui-gap-3">
  <div class="eui-ringval eui-t-warn" data-eui-ring style="--v:.64"><i data-i="gas"></i></div>
  <div class="eui-ringval eui-t-success" data-eui-ring style="--v:.92"><i data-i="battery"></i></div>
  <div class="eui-ringval eui-t-info" data-eui-ring style="--v:.4"><i data-i="flame"></i></div>
</div>
</section>

<section data-id="lamps" data-title="Gösterge lambaları" data-use="Emniyet kemeri, far, kilit, arıza: on yanık, is-warn kırmızı yanıp söner; ton --tone-rgb ile." data-js="el.classList.toggle('on')">
<div class="eui-flex eui-gap-2">
  <span class="eui-lamp on"><i data-i="user-shield"></i></span>
  <span class="eui-lamp on" style="--tone-rgb:var(--eui-info-rgb)"><i data-i="sun"></i></span>
  <span class="eui-lamp"><i data-i="lock"></i></span>
  <span class="eui-lamp is-warn"><i data-i="engine"></i></span>
</div>
</section>
