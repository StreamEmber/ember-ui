<!-- family: Konum ve yön | Pusula, minimap çerçevesi, sokak/bölge, yön çipi, koordinat, hedef işaretleri. Oyunun kendi haritası overlay'in altında çizilir; çerçeveler içi saydam bırakır. -->

<section data-id="compass" data-wide="1" data-title="Pusula şeridi" data-use="Üst orta kayan yön şeridi; hedefler şerit üstünde simge olarak durur. Yön harfleri Türkçe (K D G B), EUI.cardinals() ile değişir." data-js="EUI.compass(el, 75, [{ bearing: 120, icon: 'pin-f', tone: 'accent' }])">
<div class="eui-compass" data-heading="75" data-marks='[{"bearing":120,"icon":"pin-f","tone":"accent"},{"bearing":40,"icon":"flag-3","tone":"success"}]' style="--w:420px"></div>
</section>

<section data-id="street" data-title="Sokak ve bölge" data-use="Yön harfi + sokak adı + bölge. Sol alt veya sağ alt köşe için; eui-location__dir yönü gösterir." data-js="el.querySelector('.eui-location__dir').textContent = 'KB'">
<div class="eui-location">
  <span class="eui-location__dir">KB</span><span class="eui-vrule"></span>
  <div><div class="eui-location__street">Mirror Park Bulvarı</div><div class="eui-location__zone">East Vinewood · Los Santos</div></div>
</div>
</section>

<section data-id="heading" data-title="Yön çipi" data-use="Sadece yön harfi ve derece; en az yer kaplayan yön göstergesi." data-js="el.querySelector('b').textContent = 'KB'">
<div class="eui-heading"><b>KB</b><span>315°</span></div>
</section>

<section data-id="coords" data-title="Koordinat" data-use="Geliştirici veya yayıncı için x / y / z satırı; sayılar tabular." data-js="el.innerHTML = '<span>X<b>…</b></span>…'">
<div class="eui-coords"><span>X<b>-1204.3</b></span><span>Y<b>3180.7</b></span><span>Z<b>41.2</b></span></div>
</section>

<section data-id="minimap" data-title="Minimap çerçevesi" data-use="Dikdörtgen çerçeve, kuzey rozeti, alt bölge/saat şeridi. İçerik oyunun haritasıdır; --w ve --h boyut." data-js="el.querySelector('.eui-minimap__zone span').textContent = 'Sandy Shores'">
<div class="eui-minimap" style="--w:260px;--h:160px">
  <div class="eui-minimap__map"></div>
  <div class="eui-minimap__frame"></div><span class="eui-minimap__north">K</span>
  <div class="eui-minimap__zone"><span>Vinewood Tepeleri</span><span class="eui-num">21:14</span></div>
</div>
</section>

<section data-id="minimap-round" data-title="Yuvarlak minimap" data-use="Daire çerçeve; bölge şeridi yok, --w ve --h eşit olmalı." data-js="">
<div class="eui-minimap eui-minimap--round" style="--w:170px;--h:170px">
  <div class="eui-minimap__map"></div>
  <div class="eui-minimap__frame"></div><span class="eui-minimap__north">K</span>
</div>
</section>

<section data-id="marker" data-title="Dünya işaretçisi" data-use="Hedef üstü pin + etiket + mesafe. Ton eui-t-*; is-pulse dikkat çeker. Sürekli konumlandırma için EUI.Markers(world).update(liste)." data-js="EUI.Markers(world).update([{ x, y, icon: 'package', label: 'Teslimat', dist: 320, tone: 'danger', pulse: true }])">
<div class="eui-flex eui-gap-5 eui-items-start">
  <div class="eui-marker is-pulse"><span class="eui-marker__label">Teslimat</span><span class="eui-marker__pin"><i data-i="package"></i></span><span class="eui-marker__dist">320 m</span></div>
  <div class="eui-marker eui-t-danger"><span class="eui-marker__label">Hedef</span><span class="eui-marker__pin"><i data-i="crosshair"></i></span><span class="eui-marker__dist">1,4 km</span></div>
  <div class="eui-marker eui-t-team1"><span class="eui-marker__pin"><i data-i="user"></i></span><span class="eui-marker__dist">48 m</span></div>
</div>
</section>

<section data-id="marker-edge" data-title="Kenar işaretçisi" data-use="Ekran dışındaki hedef: pin kenarda, üstteki ok yönü gösterir (--a derece)." data-js="el.style.setProperty('--a', '50deg')">
<div class="eui-marker eui-marker--edge eui-t-danger" style="--a:50deg;margin-top:18px"><span class="eui-marker__arrow"></span><span class="eui-marker__pin"><i data-i="crosshair"></i></span><span class="eui-marker__dist">1,4 km</span></div>
</section>

<section data-id="wayarrow" data-title="Hedef oku" data-use="Büyük yönlendirme oku + mesafe (görev, teslimat). Ok --a derece döner (0 = yukarı), ton eui-t-*." data-js="el.style.setProperty('--a', '40deg'); el.querySelector('b').textContent = '320 m'">
<div class="eui-flex eui-gap-5 eui-items-start">
  <div class="eui-wayarrow" style="--a:40deg"><i></i><b>320 m</b></div>
  <div class="eui-wayarrow eui-t-danger" style="--a:-130deg"><i></i><b>1,4 km</b></div>
</div>
</section>
