<!-- family: Ekonomi ve durum | Para, aranma/ödül, saat ve hava, seviye ve XP, etki simgeleri, seri, sıralama. Sayılar MH.count / MH.money ile akıcı değişir. -->

<section data-id="cash" data-title="Para ve banka" data-use="Sağ üst köşe para göstergesi; artış/azalış farkı kısa süre yüzer. İkinci satır banka bakiyesi (kaldırılabilir)." data-js="MH.money(el, 12480, { symbol: '$' })">
<div class="mh-cash">
  <div class="mh-cash__value"><small>$</small><b data-cash>12.480</b></div>
  <div class="mh-cash__bank"><i data-i="bank"></i><span>1.204.900</span></div>
</div>
</section>

<section data-id="coin" data-title="Kompakt para" data-use="Tek satır ikon + tutar: puan, jeton, altın. Tonu mh-t-* ile değiştir; satır içi kullanılır." data-js="MH.money(el.querySelector('b'), 12400)">
<div class="mh-flex mh-gap-4">
  <div class="mh-coin"><i data-i="coin-f"></i><b>12.400</b></div>
  <div class="mh-coin mh-t-info"><i data-i="bolt"></i><b>240</b></div>
</div>
</section>

<section data-id="wanted" data-title="Aranma yıldızları" data-use="GTA tarzı 5 yıldız; dolu olanlara on sınıfı, is-flashing yanıp söner." data-js="el.querySelectorAll('.mh-i').forEach((s, i) => s.classList.toggle('on', i < 3))">
<div class="mh-wanted is-flashing"><i data-i="star-f" class="on"></i><i data-i="star-f" class="on"></i><i data-i="star-f"></i><i data-i="star-f"></i><i data-i="star-f"></i></div>
</section>


<section data-id="clock" data-title="Saat ve hava" data-use="Hava ikonu + saat + durum ve gün. İkon ad değişince hava değişir (sun, rain, …)." data-js="el.querySelector('.mh-clock__time').textContent = '06:40'">
<div class="mh-clock"><i data-i="sun"></i><span class="mh-clock__time">21:14</span><span class="mh-clock__meta"><span>Açık · 24°C</span><span>Cumartesi</span></span></div>
</section>

<section data-id="xp" data-title="Seviye ve XP" data-use="Elmas seviye rozeti + XP barı + kazanılan puan. Alt kenar HUD'u." data-js="MH.bar(el.querySelector('.mh-bar'), 77)">
<div class="mh-xp" style="--w:340px">
  <div class="mh-xp__level"><span>42</span></div>
  <div class="mh-xp__body">
    <div class="mh-xp__meta"><span>Seviye 42 · <b>+250 RP</b></span><span class="mh-num">18.450 / 24.000</span></div>
    <div class="mh-bar" data-v="77"><i class="mh-bar__gain"></i><i class="mh-bar__fill"></i></div>
  </div>
</div>
</section>

<section data-id="levelring" data-title="Seviye halkası" data-use="Halka içinde seviye numarası; small etiketi altta. --size boyut, ton mh-t-*." data-js="MH.ring(el, 0.64)">
<div class="mh-flex mh-gap-4">
  <div class="mh-levelring" data-mh-ring style="--v:.64"><b>24</b><small>SVY</small></div>
  <div class="mh-levelring mh-t-legendary" data-mh-ring style="--v:.85;--size:64px"><b>48</b></div>
</div>
</section>

<section data-id="effects" data-title="Etki simgeleri" data-use="Aktif buff/debuff'lar: simge, kalan süre (--v kalan oran), yığın sayısı. is-debuff kırmızı, is-expiring yanıp söner." data-js="el.style.setProperty('--v', 0.4)">
<div class="mh-effects">
  <div class="mh-effect" style="--v:.72"><i data-i="shield-f"></i><span class="mh-effect__time">0:43</span></div>
  <div class="mh-effect" style="--v:.4"><i data-i="run"></i><span class="mh-effect__time">0:18</span><span class="mh-effect__stack">2</span></div>
  <div class="mh-effect is-debuff" style="--v:.85"><i data-i="flame"></i><span class="mh-effect__time">0:06</span></div>
</div>
</section>

<section data-id="effect-line" data-title="Etki satırı" data-use="Simgesiz metin satırı: ad + süre. Ton çubuğu soldadır; simgeye yer olmayan dar alanlar için." data-js="el.querySelector('b').textContent = '00:43'">
<div class="mh-col mh-gap-2 mh-items-start">
  <div class="mh-effect-line mh-t-success"><span class="mh-kicker">Kalkan</span><b>00:43</b></div>
  <div class="mh-effect-line mh-t-accent"><span class="mh-kicker">Tonik etkisi</span><b>01:20</b></div>
</div>
</section>

<section data-id="streak" data-title="Seri / kombo" data-use="Sayı büyür, alttaki çubuk süre dolunca söner; 5 ve üstünde is-hot kırmızı. Sayıyı MH.streak yönetir." data-js="MH.streak(el, 5, { hot: 5, decay: 6000 })">
<div class="mh-panel mh-streak"><i data-i="streak"></i><span class="mh-streak__count">5</span><span class="mh-streak__label"><b>Öldürme serisi</b><span class="mh-sub">+%25 para</span></span><i class="mh-streak__decay"></i></div>
</section>
