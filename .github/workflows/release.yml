# v* etiketi itildiğinde: etiketteki dist/ doğru mu denetle, GitHub Release aç.
# Dağıtım npm değil, doğrudan bu etiketten jsDelivr:
#   https://cdn.jsdelivr.net/gh/StreamEmber/mhud@v<sürüm>/dist/mhud.min.css
# Etiket `npm version x.y.z` ile oluşturulur (dist/ commit'e girer), sonra: git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Etiket ile package.json sürümü aynı mı?
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then echo "::error::Etiket v$TAG ama package.json $PKG"; exit 1; fi

      - name: Etiketteki dist/ güncel mi (jsDelivr bunu sunar)
        run: |
          npm run build
          git add -N dist
          git diff --exit-code --stat -- dist || { echo "::error::Etiketteki dist/ derlemeyle aynı değil; npm version ile sürüm çıkarın"; exit 1; }

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```html
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/StreamEmber/mhud@${{ github.ref_name }}/dist/mhud.min.css">
            <script src="https://cdn.jsdelivr.net/gh/StreamEmber/mhud@${{ github.ref_name }}/dist/mhud.min.js"></script>
            ```
