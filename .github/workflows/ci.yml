# Her push ve PR'da: bağımlılıkları kur, derle, AI kılavuzu, sürüm, sunum kapsamı ve görünürlük denetimini doğrula.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run site
      - name: AI kılavuzu güncel mi
        run: |
          git diff --exit-code -- AI.md ai || { echo "::error::AI.md ve ai/ eski, npm run site calistirip ekleyin"; exit 1; }
      - name: Sürüm tutarlılığı
        run: |
          V="$(node -p "require('./package.json').version")"
          grep -q "version: '$V'" kit/js/mhud.js || { echo "::error::kit/js/mhud.js sürümü $V değil (npm run version)"; exit 1; }
      - name: Her varyant bir sunum sayfasında mı
        run: node tools/coverage.mjs
      - name: Yapay zekâya görünmeyen sınıf / belgesiz API var mı
        run: node tools/audit.mjs
